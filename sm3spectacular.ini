; SM3 Spectacular Edition - by zryuyu
; ReShade = d3d9.dll | companion = binkw32.dll
; Visuals: MXAO -> SSR -> grade -> bloom -> SMAA -> CAS -> SpectacularFinish
; Preset=Custom keeps ini knobs. Ultra/Balanced/Performance override them.
[sm3spectacular]
Preset=Custom
FpsLimit=60
; Native-only FPS counter (hybrid: use ReShade Home overlay)
ShowFpsCounter=0
; F8 = mission-safe 30 FPS toggle
FpsToggleVk=119

; Hybrid only. Do not ChainDLL ReShade.
UseReShade=1
Visuals=0
ChainDLL=

; World / sampler (companion)
Anisotropic=1
Anisotropy=16
TextureLodBias=-0.25

LodBoost=1
LodHighDistance=400
LodMediumDistance=900
LodInteriorDistance=50
LodDistrictCull=0
CityDetail=2
LodCityFar=40000
LodCityNear=10
LodCityBudget=400000
LodCityBudgetC=80000

; Camera / widescreen
Fov=75
AspectFovCorrect=1
DesktopResolution=0
DisplayWidth=0
DisplayHeight=0

; Atmosphere (FogVolumetric=0 for clearer skyline)
FogDepth=1
FogVolumetric=1
ParticleScale=3600

; Street life (CityLife=0 if a mission misbehaves)
CityLife=1
TrafficDensity=2.0
TrafficMaxVehicles=96
TrafficMaxLods=1500
TrafficSpawnMedium=280
TrafficSpawnFar=420
TrafficSpawnVeryFar=1000
TrafficLevelMedium=140
TrafficLevelFar=480
TrafficLevelVeryFar=1000
TrafficVehicleSpeed=13
TrafficCopSpeed=32
TrafficThugSpeed=26
TrafficPromoteNearHero=1
PedsMaxVisible=-1
MaxFakePeds=200
TeamMaxTokens=10
EntitiesFadeIn=280
EntitiesFadeOut=400
EntitiesNoFadeRadius=180

; Steam: 0=off, 1=auto (default), 2=always Steam-safe visuals
; Steam-safe drops MXAO/SSR; FilmicPass + Finish compensate.
SteamCompat=1
SteamForceWindowed=1
